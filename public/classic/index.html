<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance Portal (Classic)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/classic/styles.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="brand">📋 <span>Attendance&nbsp;Portal</span></div>
      <p class="muted">Sign in to view your attendance dashboard.</p>
      <label>Username<input id="username" value="STOIST25963" required /></label>
      <label>Password<input id="password" type="password" value="Shiv10" required /></label>
      <button type="submit" id="loginBtn">Sign in</button>
      <p id="loginError" class="error"></p>

      <div style="margin-top: 16px; border-top: 1px solid #eef1f7; padding-top: 12px; font-size: .85rem;">
        <span class="muted" style="display:block;margin-bottom:6px;font-weight:600;">Quick Accounts:</span>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button type="button" class="classic-acc-btn" data-user="STOIST25963" data-pass="Shiv10" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;text-align:left;background:#fdfdfd;">
            <b>Shivang Saxena</b> (STOIST25963 · AIML)
          </button>
          <button type="button" class="classic-acc-btn" data-user="STOIST251161" data-pass="Cwbqs$09" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;text-align:left;background:#fdfdfd;">
            <b>Ayush Katare</b> (STOIST251161 · CSE)
          </button>
          <button type="button" class="classic-acc-btn" data-user="DEMO123" data-pass="demo" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;text-align:left;background:#fdfdfd;">
            <b>Demo Student</b> (DEMO123)
          </button>
        </div>
      </div>
    </form>
    <p class="disclaimer">Self-contained demo. <a href="/" style="color:var(--accent);text-decoration:underline;">Switch to Modern UI ↗</a></p>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="brand small">📋 <span>Attendance&nbsp;Portal</span></div>
      <div class="topbar-right">
        <a href="/" style="font-size:.85rem;color:var(--accent);margin-right:12px;text-decoration:none;">Modern UI ↗</a>
        <span id="whoami" class="muted"></span>
        <button id="logoutBtn" class="ghost">Logout</button>
      </div>
    </header>

    <main class="container">
      <section class="profile card">
        <div class="avatar" id="avatar">D</div>
        <div class="profile-info">
          <h2 id="pName">—</h2>
          <div class="chips">
            <span class="chip" id="pUser"></span>
            <span class="chip" id="pStuid"></span>
            <span class="chip" id="pEmail"></span>
          </div>
        </div>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" />
          </svg>
          <div class="ring-label"><strong id="ringPct">0%</strong><small>overall</small></div>
        </div>
      </section>

      <section class="stats">
        <div class="stat card"><span class="num" id="sPresent">0</span><span class="lbl">Present</span></div>
        <div class="stat card"><span class="num danger" id="sAbsent">0</span><span class="lbl">Absent</span></div>
        <div class="stat card"><span class="num" id="sTotal">0</span><span class="lbl">Total sessions</span></div>
        <div class="stat card"><span class="num" id="sAvg">0%</span><span class="lbl">Subject avg</span></div>
      </section>

      <nav class="tabs">
        <button class="tab active" data-tab="sessions">Sessions</button>
        <button class="tab" data-tab="assignments">Assignments</button>
        <button class="tab" data-tab="exams">Exams</button>
      </nav>

      <!-- SESSIONS TAB -->
      <section id="tab-sessions" class="tabpane">
        <div class="filters card">
          <div class="field">
            <label>View by</label>
            <select id="mode">
              <option value="date">Date range</option>
              <option value="subject">Subject</option>
            </select>
          </div>
          <div class="field date-field">
            <label>From</label><input type="date" id="dateFrom" />
          </div>
          <div class="field date-field">
            <label>To</label><input type="date" id="dateTo" />
          </div>
          <div class="field subject-field hidden">
            <label>Subject</label>
            <select id="subject"></select>
          </div>
          <button id="loadBtn">Load</button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>

      <!-- ASSIGNMENTS TAB -->
      <section id="tab-assignments" class="tabpane hidden">
        <div id="assignmentList" class="session-list"></div>
      </section>

      <!-- EXAMS TAB -->
      <section id="tab-exams" class="tabpane hidden">
        <div id="examList" class="session-list"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/classic/app.js"></script>
</body>
</html>
